<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#F2F3F5;font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;-webkit-font-smoothing:antialiased;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F2F3F5;padding:60px 20px;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0">

        <!-- Logo -->
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="font-size:22px;font-weight:700;color:#1A1A1A;letter-spacing:5px;">IPMS</span>
          </td>
        </tr>

        <!-- Main card -->
        <tr>
          <td style="background:#ffffff;border-radius:20px;padding:0;overflow:hidden;">

            <!-- Title block -->
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:44px 48px 0;">
                  <p style="margin:0 0 6px;font-size:11px;font-weight:500;color:#BBBBBB;letter-spacing:2.5px;">{{SUBTITLE}}</p>
                  <p style="margin:0;font-size:22px;font-weight:700;color:#111111;letter-spacing:-0.5px;line-height:1.3;">{{TITLE}}</p>
                </td>
              </tr>
            </table>

            <!-- Accent line -->
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:24px 48px 0;">
                  <table width="32" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="background:#111111;height:2px;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- Body -->
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:28px 48px 0;">
                  <p style="margin:0;font-size:14px;color:#555555;line-height:2.1;">{{BODY}}</p>
                </td>
              </tr>
            </table>

            {{CONTENT}}

            <!-- Divider -->
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:28px 48px 0;">
                  <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="border-top:1px solid #F0F0F0;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- Info box -->
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:20px 48px 44px;">
                  <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="background:#F7F8FA;border-radius:12px;padding:20px 22px;">
                        <p style="margin:0 0 10px;font-size:11px;font-weight:700;color:#333333;letter-spacing:1px;">{{INFO_TITLE}}</p>
                        <p style="margin:0;font-size:12px;color:#999999;line-height:2.0;">{{INFO_BODY}}</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:24px 6px 0;">
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td>
                  <p style="margin:0 0 5px;font-size:11px;color:#BBBBBB;line-height:1.8;">본 메일은 발신 전용으로 회신되지 않습니다.</p>
                  <p style="margin:0;font-size:11px;color:#CCCCCC;">(주)마인드프로 &middot; mindpro.co.kr</p>
                </td>
                <td align="right" style="vertical-align:bottom;">
                  <p style="margin:0;font-size:10px;color:#DDDDDD;">&copy; 2026 IPMS</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
