# 1. 프로파일 활성화 설정
#spring:
#  config:
#    activate:
#      on-profile: loc

spring:
  ai:
    openai:
      api-key: "temporary-key-for-validation"
      chat:
        options:
          model: "glm-4.7-flash:latest"
      embedding: # 로컬 Ollama 모델을 임베딩 모델로 사용
        base-url: "http://127.0.0.1:11434"
        options:
          model: "glm-4.7-flash:latest" # 형님이 선호하시는 기존 메인 모델로 임베딩까지 통합
  autoconfigure:
    exclude:
      # 1. OpenAI 관련 모든 자동 설정 제외
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

      # 2. Ollama 관련 자동 설정 제외
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration

      # 3. 관찰(Observation/Metrics) 및 모니터링 제외 (현재 에러의 핵심 원인)
      - org.springframework.ai.model.chat.observation.autoconfigure.ChatObservationAutoConfiguration
      - org.springframework.ai.model.image.observation.autoconfigure.ImageObservationAutoConfiguration

      # 4. 기타 유틸리티 설정 제외
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  # 2. 데이터베이스 및 HikariCP 설정
  datasource:
   # 1번 DB (기존 PostgreSQL - Primary)
    datasource1:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: ${DB1:jdbc:log4jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema="MP_IPMS_PA",public}
      username: ${DB1_YOUR_DB_NAME:YOUR_DB_NAME}
      password: ${DB1_YOUR_DB_PASSWORD:YOUR_DB_PASSWORD}
      hikari:
        pool-name: HikariCP-DB1
        maximum-pool-size: 10
        auto-commit: true
        connection-test-query: SELECT 1

    # 2번 DB
    datasource2:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: ${DB2:jdbc:log4jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema="MP_IPMS_CORP"}
      username: ${DB2_YOUR_DB_NAME:YOUR_DB_NAME}
      password: ${DB2_YOUR_DB_PASSWORD:YOUR_DB_PASSWORD}
      hikari:
        pool-name: HikariCP-DB2
        maximum-pool-size: 10
        auto-commit: true
        connection-test-query: SELECT 1

    # 3번 DB
    datasource3:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: ${DB3:jdbc:log4jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema="MP_AI"}
      username: ${DB3_YOUR_DB_NAME:YOUR_DB_NAME}
      password: ${DB3_YOUR_DB_PASSWORD:YOUR_DB_PASSWORD}
      hikari:
        pool-name: HikariCP-DB3
        maximum-pool-size: 10
        auto-commit: true
        connection-test-query: SELECT 1

  # 메일 발송 설정 (네이버웍스 SMTP)
  mail:
    host: ${MAIL_HOST:smtp.mail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:mail@mail.com}
    password: ${MAIL_PASSWORD:mailpassword}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.mail.com

  # 3. 빈 중복 등록 허용 (필터 등록 등 유연한 설정을 위해)
  main:
    allow-bean-definition-overriding: true

  # 8. 서블릿 멀티파트 설정 (파일 용량 제한)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB       # 개별 파일 최대 용량
      max-request-size: 10MB    # 한 번의 HTTP 요청에 포함된 전체 용량
#      location: ./temp/uploads # 임시 디렉토리 (파일 처리용)	

# 4. MyBatis 설정
#mybatis:
#  mapper-locations: classpath:mapper/**/*.xml   # 매퍼 XML 파일 위치
#  type-aliases-package: kr.co.mindpro.ipms
#  configuration:
#    map-underscore-to-camel-case: true          # snake_case -> camelCase 매핑
#    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl
#    call-setters-on-nulls: true

# 5. JWT 설정 (반드시 32자 이상의 비밀키 사용)
jwt:
  secret: YOUR_JWT_SECRET
  # 30분 (30 * 60 * 1000)
  expiration: 1800000
  # 7일 (7 * 24 * 60 * 60 * 1000)
  refresh-expiration: 604800000

# 6. Swagger (Springdoc OpenAPI 3) 설정
springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html             # 커스텀 접속 경로: http://localhost:8080/swagger-ui.html
    tags-sorter: alpha              # 태그 정렬 방식
    operations-sorter: alpha        # API 정렬 방식
    display-request-duration: true  # 요청 소요 시간 표시
    persistAuthorization: true      # 페이지를 새로고침해도 Authorize에 입력한 토큰 값이 유지되도록 설정 
    filter: true 

# 7. 로깅 설정 (Log4j2 연동)
logging:
  config: classpath:log4j2-spring.xml
  level:
    kr.co.mindpro: DEBUG                 			# 내 프로젝트 로그 레벨
    org.springframework.security: DEBUG       # 스프링 시큐리티 권한 체크 로그
    org.springframework.web: DEBUG            # 웹 요청/응답 로그	
    # [추가] Spring 트랜잭션 관리 로그 활성화
    org.springframework.transaction.interceptor: TRACE	 
    org.springframework.transaction: DEBUG
    org.springframework.jdbc.datasource: DEBUG   # MyBatis/JDBC 사용 시	
    # log4jdbc 설정 (기존 유지)
    jdbc.sqlonly: OFF              				# 실행 SQL 로그 출력
    jdbc.sqltiming: INFO
    jdbc.resultsettable: INFO       				# 결과 테이블 로그 출력 (log4jdbc)

# 9. 파일 저장소 설정 (확장성 고려)
file:
  storage:
    type: s3              # 현재는 'local' 사용, 나중에 S3 연동 시 's3'로 변경
    local-dir: ./temp/uploads/ # 로컬 저장소 상대 경로

# 나중에 S3 버킷 생성 시 활성화할 영역 (현재는 주석 처리 또는 빈 값)
cloud:
  aws:
    credentials:
      access-key: YOUR_S3_ACCESS_KEY
      secret-key: YOUR_S3_SECRET_KEY
    region:
      static: us-standard
    s3:
      endpoint: https://endpoint.url
      bucket: bucket
    stack:
      auto: false # CloudFormation 자동 설정 끔	

# 프론트엔드 URL (비밀번호 재설정 링크 생성용)
app:
  front-url: http://localhost:4000

# 소셜 로그인
social:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:YOUR_KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:YOUR_KAKAO_CLIENT_SECRET}
  naver:
    client-id: ${NAVER_CLIENT_ID:YOUR_NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET:YOUR_NAVER_CLIENT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID
    client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}

# 외부 API
api:
  nts:
    # 공공데이터포털 마이페이지 > 일반 인증키 (Decoding) 복사 후 붙여넣기
    key: "YOUR_NTS_KEY"
